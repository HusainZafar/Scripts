apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ipv6-cluster
  region: us-west-2

iam:
  withOIDC: true

kubernetesNetworkConfig:
  ipFamily: IPv4

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest

fargateProfiles:
  - name: fp-default
    selectors:
      - namespace: default
      - namespace: kube-system
